<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Favicon -->

    <link rel="shortcut icon" type="image/x-icon" href="{{ site.baseurl }}/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ site.baseurl }}/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ site.baseurl }}/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ site.baseurl }}/favicon-16x16.png">
    
    <!-- Custom CSS & Bootstrap Core CSS - Uses Bootswatch Flatly Theme: http://bootswatch.com/flatly/ -->
    <link rel="stylesheet" href="{{ "/style.css" | prepend: site.baseurl }}">

    <!-- Custom Fonts -->
    <link rel="stylesheet" href="{{ "/css/font-awesome/css/font-awesome.min.css" | prepend: site.baseurl }}">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Kaushan+Script' rel='stylesheet' type='text/css'>
    <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet" type="text/css">
    <link href='https://fonts.googleapis.com/css?family=Droid+Serif:400,700,400italic,700italic' rel='stylesheet' type='text/css'>
    <link href='https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700' rel='stylesheet' type='text/css'>

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
        <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <style>
  section#services, 
  section#team, 
  section#portfolio, 
  section#about,
  .about-section {
    background-color: #0c0c0c !important;
    background-image: 
        radial-gradient(circle at center, #1a1a1a 0%, #0c0c0c 85%),
        linear-gradient(rgba(101, 136, 166, 0.08) 1px, transparent 1px), 
        linear-gradient(90deg, rgba(101, 136, 166, 0.08) 1px, transparent 1px) !important;
    background-size: auto, 45px 45px !important;
    background-position: center center !important;
    padding: 120px 0 !important;
    color: #e0e0e0 !important;
  }

  /* Fix per i mirini HUD sulla foto profilo */
  .profile-img-container::before, 
  .profile-img-container::after {
    content: "" !important;
    position: absolute !important;
    width: 45px !important;
    height: 45px !important;
    border: 2px solid #6588A6 !important;
    display: block !important;
    z-index: 10 !important;
  }
  .profile-img-container::before { top: 0; left: 0; border-right: none !important; border-bottom: none !important; }
  .profile-img-container::after { bottom: 0; right: 0; border-left: none !important; border-top: none !important; }

  /* Forza l'allineamento del testo bio */
  .about-bio-text {
    text-align: left !important;
    color: #c0c0c0 !important;
  }
  .about-text-highlight {
    color: #6588A6 !important;
    text-align: left !important;
    border-left: 4px solid #6588A6 !important;
    padding-left: 20px !important;
  }
</style>
    {% include google_analytics.html %}
</head>
